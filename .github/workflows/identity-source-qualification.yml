name: Identity receiver source qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-parent-23:
    name: Source parent 23 fixture (not published adoption)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/firefly-parent
          ref: 6442bd51733ade4d5f4583e1afe812dd2c520b40
          path: .qualification/firefly-parent
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify generation evidence parser controls
        run: python3 -B -m unittest discover -s tooling -p 'test_verify_generated_receiver.py' -v
      - name: Prepare exact source-parent fixture
        run: python3 tooling/prepare_source_fixture.py
      - name: Run genuine reactor verification in the isolated fixture
        run: |
          umask 077
          task_maven_status=0
          mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/security-center-source-m2" verify > .qualification/maven.log 2>&1 || task_maven_status=$?
          python3 tooling/summarize_source_fixture.py "$task_maven_status"
          if [ "$task_maven_status" -eq 0 ]; then
            python3 tooling/verify_generated_receiver.py
          fi
          exit "$task_maven_status"
      - name: Preserve source qualification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-parent-23-summary
          path: .qualification/source-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve original producer and generated SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-receiver-generated-sdk
          path: |
            .qualification/receiver-sdk-summary.json
            domain-core-security-center-web/target/receiver-openapi.json
            domain-core-security-center-web/target/surefire-reports/TEST-*ReceiverOpenApiContractTest.xml
            domain-core-security-center-sdk/src/main/resources/openapi.yml
            domain-core-security-center-sdk/target/generated-sources/src/gen/java/main/
            domain-core-security-center-sdk/target/domain-core-security-center-sdk-*.jar
            domain-core-security-center-sdk/target/surefire-reports/TEST-*GeneratedReceiverBearerContractTest.xml
          if-no-files-found: error
          retention-days: 14
